# The only real-world entities Sentinel Desk may ingest or reference.
#
# This is an ALLOWLIST: anything not listed here is never loaded.
# ingest-edgar, seed-refdata and the trade generator read this file, and tests
# assert that every real filing and counterparty traces back to an entry below.

# Banks whose SEC filings are ingested (Phase 1). CIKs come from
# https://www.sec.gov/files/company_tickers.json at ingest time.
banks:
  - { ticker: BAC, name: "Bank of America Corp" }
  - { ticker: C,   name: "Citigroup Inc" }
  - { ticker: WFC, name: "Wells Fargo & Co" }
  - { ticker: GS,  name: "Goldman Sachs Group Inc" }
  - { ticker: MS,  name: "Morgan Stanley" }
  - { ticker: USB, name: "U.S. Bancorp" }
  - { ticker: PNC, name: "PNC Financial Services Group Inc" }
  - { ticker: TFC, name: "Truist Financial Corp" }
  - { ticker: COF, name: "Capital One Financial Corp" }
  - { ticker: BK,  name: "Bank of New York Mellon Corp" }

# Where counterparties for the synthetic trade book come from.
counterparties:
  # Real entities: only GLEIF subsidiaries of the banks listed above.
  real:
    source: gleif
    scope: subsidiaries_of_banks
    max_per_bank: 15
  # Everything else is fictional, generated with Faker (fixed seed).
  fictional:
    count: 150
    kinds: [hedge_fund, asset_manager, corporate, insurer, pension_fund]
    seed: 42
