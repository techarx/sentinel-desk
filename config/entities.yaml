# The only real-world entities Sentinel Desk may ingest or reference.
#
# This is an ALLOWLIST: anything not listed here is never loaded.
# ingest-edgar, seed-refdata and the trade generator read this file, and tests
# assert that every real filing and counterparty traces back to an entry below.

# Banks whose SEC filings are ingested (Phase 1).
# The CIK is the SEC's permanent company ID and is what ingestion looks up;
# tickers can change (Bank of New York Mellon moved from BK to BNY).
# Verified against https://www.sec.gov/files/company_tickers.json on 2026-11-11.
banks:
  - { ticker: BAC, cik: 70858,   name: "Bank of America Corp" }
  - { ticker: C,   cik: 831001,  name: "Citigroup Inc" }
  - { ticker: WFC, cik: 72971,   name: "Wells Fargo & Co" }
  - { ticker: GS,  cik: 886982,  name: "Goldman Sachs Group Inc" }
  - { ticker: MS,  cik: 895421,  name: "Morgan Stanley" }
  - { ticker: USB, cik: 36104,   name: "U.S. Bancorp" }
  - { ticker: PNC, cik: 713676,  name: "PNC Financial Services Group Inc" }
  - { ticker: TFC, cik: 92230,   name: "Truist Financial Corp" }
  - { ticker: COF, cik: 927628,  name: "Capital One Financial Corp" }
  - { ticker: BNY, cik: 1390777, name: "Bank of New York Mellon Corp" }

# Where counterparties for the synthetic trade book come from.
counterparties:
  # Real entities: only GLEIF subsidiaries of the banks listed above.
  real:
    source: gleif
    scope: subsidiaries_of_banks
    max_per_bank: 15
  # Everything else is fictional, generated with Faker (fixed seed).
  fictional:
    count: 150
    kinds: [hedge_fund, asset_manager, corporate, insurer, pension_fund]
    seed: 42
