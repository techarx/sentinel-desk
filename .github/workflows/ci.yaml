name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/devbox init -backend=false
      - run: terraform -chdir=infra/devbox validate

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck infra/devbox/bootstrap.sh deploy/kind/install-gvisor.sh scripts/*.sh

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Throwaway Postgres + pgvector: upgrade, downgrade, upgrade, then role permission checks.
      - run: ./scripts/db-test.sh

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
      - name: Validate Kubernetes manifests
        # CRD-based resources (Argo CD Application, CNPG Cluster, PodMonitor) have no built-in schema; they are checked for YAML validity only.
        run: kubeconform -strict -summary -ignore-missing-schemas deploy/platform deploy/tests deploy/data deploy/apps deploy/argocd/apps deploy/argocd/root-app.yaml

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # hashFiles() is only allowed at step level, so the skip-when-no-Python check lives here.
      - uses: astral-sh/ruff-action@v3
        if: ${{ hashFiles('**/*.py') != '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ingest-edgar unit tests
        run: |
          pip install -r services/ingest-edgar/requirements-dev.txt
          python -m pytest -q services/ingest-edgar/tests

  # Added in later phases: golangci-lint (sidecar-go), eslint (ui), image build + Trivy + cosign, eval gate.
