# Builds service images, pushes them to GHCR, then commits the new tag to Git
# so Argo CD rolls it out (the "CI updates the manifest" GitOps pattern).
# Each job only builds when its own files changed (or on a manual run).
name: images

on:
  push:
    branches: [main]
    paths:
      - services/**
      - config/entities.yaml
      - .github/workflows/images.yaml
  workflow_dispatch:

permissions:
  contents: write   # commit the new image tag
  packages: write   # push to ghcr.io

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      db-migrate: ${{ steps.diff.outputs.db-migrate }}
      ingest-edgar: ${{ steps.diff.outputs.ingest-edgar }}
      trades: ${{ steps.diff.outputs.trades }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          changed() {  # changed <path regex>: true if any file under it changed in this push
            if [ "${GITHUB_EVENT_NAME}" != "push" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              echo true; return
            fi
            git diff --name-only "${BEFORE}" "${GITHUB_SHA}" | grep -qE "$1" && echo true || echo false
          }
          echo "db-migrate=$(changed '^(services/db/|scripts/db-test.sh|\.github/workflows/images.yaml)')" >> "$GITHUB_OUTPUT"
          echo "ingest-edgar=$(changed '^(services/ingest-edgar/|config/entities.yaml|\.github/workflows/images.yaml)')" >> "$GITHUB_OUTPUT"
          echo "trades=$(changed '^(services/trades/|scripts/trades-test.sh|config/entities.yaml|\.github/workflows/images.yaml)')" >> "$GITHUB_OUTPUT"

  db-migrate:
    needs: changes
    if: needs.changes.outputs.db-migrate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same test as CI and the dev machine: never ship migrations that fail it.
      - name: Test migrations
        run: ./scripts/db-test.sh
      - uses: ./.github/actions/build-and-bump
        with:
          image: sentinel-db-migrate
          context: services/db
          dockerfile: services/db/Dockerfile
          kustomization: deploy/apps/db-migrate/kustomization.yaml
          token: ${{ secrets.GITHUB_TOKEN }}

  ingest-edgar:
    needs: [changes, db-migrate]
    # Runs after db-migrate (if that ran) so the two tag commits never race.
    if: always() && needs.changes.outputs.ingest-edgar == 'true' && needs.db-migrate.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: |
          pip install -r services/ingest-edgar/requirements-dev.txt
          python -m pytest -q services/ingest-edgar/tests
      - uses: ./.github/actions/build-and-bump
        with:
          image: sentinel-ingest-edgar
          context: .
          dockerfile: services/ingest-edgar/Dockerfile
          kustomization: deploy/apps/ingest-edgar/kustomization.yaml
          token: ${{ secrets.GITHUB_TOKEN }}

  trades:
    needs: [changes, db-migrate, ingest-edgar]
    # Runs after the other image jobs (if they ran) so tag commits never race.
    if: >-
      always() && needs.changes.outputs.trades == 'true'
      && needs.db-migrate.result != 'failure' && needs.ingest-edgar.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: |
          pip install -r services/trades/requirements-dev.txt
          python -m pytest -q services/trades/tests
      # Real Postgres + Redis + Neo4j: seed, stream, redelivery, totals.
      - name: Integration test
        run: ./scripts/trades-test.sh
      - uses: ./.github/actions/build-and-bump
        with:
          image: sentinel-trades
          context: .
          dockerfile: services/trades/Dockerfile
          kustomization: deploy/apps/trades/kustomization.yaml
          token: ${{ secrets.GITHUB_TOKEN }}
