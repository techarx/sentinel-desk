# Loads reference data (desks, books, counterparties incl. GLEIF subsidiaries,
# customers) into Postgres and Neo4j. Idempotent.
#
# A Sync hook in wave -1: runs on every sync of the trades app (which happens
# whenever CI ships a new image, because the Deployments' image tag changes),
# before the generator and consumer (wave 0) are updated.
apiVersion: batch/v1
kind: Job
metadata:
  name: trades-seed
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trades-seed
        app.kubernetes.io/part-of: sentinel-trades
    spec:
      restartPolicy: Never
      nodeSelector:
        workload: general
      # No service-link env vars: Kubernetes would otherwise inject e.g. REDIS_PORT=tcp://10.x.x.x:6379
      # for the Service named "redis", clashing with our own settings. Services are found by DNS name.
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: ghcr.io/techarx/sentinel-trades   # tag set by kustomization.yaml
          args: ["seed"]
          env:
            # Reference data is written by the schema owner.
            - { name: PGHOST, value: sentinel-pg-rw }
            - { name: PGDATABASE, value: sentinel }
            - { name: PGSSLMODE, value: require }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: pg-app-credentials, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: pg-app-credentials, key: password } }
            - { name: NEO4J_URI, value: "bolt://neo4j:7687" }
            - name: NEO4J_AUTH
              valueFrom: { secretKeyRef: { name: neo4j-auth, key: NEO4J_AUTH } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
