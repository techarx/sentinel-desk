# Consumes the "trades" stream (consumer group "exposure"): stores trades,
# upserts exposures in Postgres, mirrors them as TRADES_WITH edges in Neo4j.
# Always on; idle when the generator is off.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade-consumer
  labels:
    app.kubernetes.io/name: trade-consumer
    app.kubernetes.io/part-of: sentinel-trades
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trade-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trade-consumer
        app.kubernetes.io/part-of: sentinel-trades
    spec:
      nodeSelector:
        workload: general
      # No service-link env vars: Kubernetes would otherwise inject e.g. REDIS_PORT=tcp://10.x.x.x:6379
      # for the Service named "redis", clashing with our own settings. Services are found by DNS name.
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: consumer
          image: ghcr.io/techarx/sentinel-trades   # tag set by kustomization.yaml
          args: ["consume"]
          env:
            - { name: BATCH_SIZE, value: "500" }
            # stream_writer: insert trades, upsert exposures; nothing else.
            - { name: PGHOST, value: sentinel-pg-rw }
            - { name: PGDATABASE, value: sentinel }
            - { name: PGSSLMODE, value: require }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: pg-role-stream-writer, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: pg-role-stream-writer, key: password } }
            - { name: REDIS_HOST, value: redis }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: redis-auth, key: password } }
            - { name: NEO4J_URI, value: "bolt://neo4j:7687" }
            - name: NEO4J_AUTH
              valueFrom: { secretKeyRef: { name: neo4j-auth, key: NEO4J_AUTH } }
          ports:
            - { name: metrics, containerPort: 9100 }
          readinessProbe:
            httpGet: { path: /metrics, port: metrics }
          livenessProbe:
            httpGet: { path: /metrics, port: metrics }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
