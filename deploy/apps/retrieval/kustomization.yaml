# CI (.github/workflows/images.yaml) rewrites newTag after each image build.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: data
resources:
  - aws-config.yaml
  - deployment.yaml
  - service.yaml
images:
  - name: ghcr.io/techarx/sentinel-retrieval
    newTag: sha-32fdec3
