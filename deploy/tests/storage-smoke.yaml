# Proves data on the sentinel-data StorageClass survives a cluster rebuild.
# First run: writes a marker file with the current time.
# Later runs (even after make down && make up): find and print the same marker.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-smoke
  namespace: data
spec:
  storageClassName: sentinel-data
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: storage-smoke
  namespace: data
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: check
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          if [ -f /data/marker ]; then echo "FOUND marker: $(cat /data/marker)";
          else date -u +%Y-%m-%dT%H:%M:%SZ > /data/marker; echo "WROTE marker: $(cat /data/marker)"; fi
          echo "node: $NODE_NAME"
      env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      volumeMounts:
        - name: data
          mountPath: /data
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        limits:
          cpu: 100m
          memory: 32Mi
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: storage-smoke
