# Retrieval service (Phase 2). Wave 3: needs the data stores and schema.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: retrieval
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/techarx/sentinel-desk.git
    targetRevision: main
    path: deploy/apps/retrieval
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry:
      limit: 5
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
