# Runs the database migrations Job. Wave 1: after Postgres (wave 0) is healthy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: db-migrate
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/techarx/sentinel-desk.git
    targetRevision: main
    path: deploy/apps/db-migrate
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry:
      limit: 5
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
