# Pods with runtimeClassName: gvisor run under runsc, and are automatically
# scheduled onto the sandbox node (and tolerate its taint).
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
scheduling:
  nodeSelector:
    sandbox: "true"
  tolerations:
    - key: sandbox
      operator: Equal
      value: "true"
      effect: NoSchedule
